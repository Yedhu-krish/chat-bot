name: AIBOT CI/CD

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Docker Version
        run: docker --version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/chatbot:$IMAGE_TAG .

      - name: Push Docker Image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/chatbot:$IMAGE_TAG

          echo "image=$REGISTRY/chatbot:$IMAGE_TAG" >> "$GITHUB_OUTPUT"


  cd:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to EC2
        env:
          IMAGE: ${{ needs.ci.outputs.image }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --region "$AWS_REGION" \
            --parameters "commands=[
            \"sudo -iu ubuntu bash -c 'cd /home/ubuntu/chat-bot && export BACKEND_IMAGE=$IMAGE && aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY && docker compose pull backend celery && docker compose up -d --force-recreate backend celery'\",
            \"sudo -iu ubuntu bash -c 'CURRENT_IMAGE=\\\"$IMAGE\\\"; echo Current image: \\$CURRENT_IMAGE; echo Images before cleanup:; docker images \\\"$ECR_REGISTRY\\\" --format \\\"{{.Repository}}:{{.Tag}}\\\"; for image in \\$(docker images \\\"$ECR_REGISTRY\\\" --format \\\"{{.Repository}}:{{.Tag}}\\\"); do if [ \\\"\\$image\\\" != \\\"\\$CURRENT_IMAGE\\\" ]; then echo Removing \\\"\\$image\\\"; docker rmi \\\"\\$image\\\" || true; fi; done; echo Images after cleanup:; docker images \\\"$ECR_REGISTRY\\\" --format \\\"{{.Repository}}:{{.Tag}}\\\"'\"
          ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          echo "----- SSM OUTPUT -----"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "----- SSM ERROR -----"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed"
            exit 1
          fi

          echo "Deployment Completed Successfully"